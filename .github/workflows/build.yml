name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check project files
        run: |
          echo "Checking project..."
          ls -la
          test -f buildozer.spec || {
            echo "ERROR: buildozer.spec not found!"
            exit 1
          }
          test -f main.py || {
            echo "ERROR: main.py not found!"
            exit 1
          }

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libsqlite3-dev libreadline-dev libssl-dev \
            libffi-dev libbz2-dev

      - name: Upgrade pip and install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade Cython==0.29.36 buildozer

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelart-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
